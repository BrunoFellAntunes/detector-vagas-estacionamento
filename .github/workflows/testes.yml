name: Testes do projeto

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  verificar:
    name: Python 3.13 em ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.13'
          cache: pip
      - name: Instalar dependências
        run: python -m pip install -r requirements.txt
      - name: Executar testes de comportamento
        run: python -m unittest discover -s tests -v
      - name: Gerar dados simulados
        run: python demo.py
      - name: Processar vídeo completo
        run: python detector.py --source dados/video_simulado.mp4 --reference dados/referencia_vazia.png --config dados/vagas_demo.json --output resultados/video
      - name: Conferir saída contra o gabarito
        run: python verificar_demo.py
